services:
  app:
    image: ecowitt
    cpus: 2.0 
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecowitt
    restart: always
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - NEXT_PUBLIC_RT_REFRESH_MS=300000
      - PI_SIDECAR_URL=http://pi-sidecar:3001
    env_file:
      - .env
    volumes:
      - ./DNT:/app/DNT
      - ./data:/app/data
      - ./src/config:/app/src/config
      - ./eco.ts:/app/eco.ts
    depends_on:
      pi-sidecar:
        condition: service_healthy

  pi-sidecar:
    image: ecowitt-pi-sidecar
    build:
      context: .
      dockerfile: pi-sidecar/Dockerfile
    container_name: ecowitt-pi-sidecar
    restart: always
    env_file:
      - .env
    environment:
      - AI_AGENT_HOST=0.0.0.0
      - AI_AGENT_PORT=3001
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
